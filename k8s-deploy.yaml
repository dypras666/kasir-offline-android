apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-kasir-expo
  namespace: yayasan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offline-kasir-expo
  template:
    metadata:
      labels:
        app: offline-kasir-expo
    spec:
      containers:
      - name: web
        image: repo-ischool.azzr.biz.id/offline-kasir-expo-web:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: offline-kasir-expo
  namespace: yayasan
spec:
  selector:
    app: offline-kasir-expo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
